# Approval-gated Kafka topics and ACLs for one environment (TEST for now; PROD is added later on purpose).
# Preview stage: plans and checks the exact six creations, nothing applied.
# Apply stage (only when enableApply is ticked): waits at the confluent-<environment> approval check,
# re-plans, re-checks the same six creations, then applies the saved plan.
name: applications-apply-${{ parameters.environment }}-$(Date:yyyyMMdd)$(Rev:.r)
trigger: none
pr: none

parameters:
  - name: environment
    displayName: Environment to deploy
    type: string
    default: test
    values: [test, prod]
  - name: enableApply
    displayName: Apply after approval (leave unticked to preview only)
    type: boolean
    default: false

pool:
  vmImage: ubuntu-24.04

variables:
  terraformVersion: '1.17.1'
  azureServiceConnection: azure-confluent-service-connection
  keyVaultName: kv-confluent-example

stages:
  - stage: Preview
    displayName: Preview ${{ parameters.environment }} (no Apply)
    jobs:
      - job: PlanOnly
        steps:
          - checkout: self
          - bash: |
              set -euo pipefail
              VERSION="$(terraformVersion)"
              curl --fail --silent --show-error --location --retry 3 -o terraform.zip \
                "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
              unzip -q terraform.zip terraform
              sudo install terraform /usr/local/bin/terraform
              rm -f terraform.zip terraform
              terraform fmt -check -recursive
              terraform -chdir=environments/${{ parameters.environment }} init -backend=false -input=false -lockfile=readonly
              terraform -chdir=environments/${{ parameters.environment }} validate -no-color
            displayName: Install and validate Terraform
          - task: AzureKeyVault@2
            displayName: Retrieve credentials from Key Vault
            inputs:
              azureSubscription: $(azureServiceConnection)
              KeyVaultName: $(keyVaultName)
              SecretsFilter: confluent-cloud-api-key,confluent-cloud-api-secret,${{ parameters.environment }}-platform-kafka-api-key,${{ parameters.environment }}-platform-kafka-api-secret
              RunAsPreJob: false
          - task: AzureCLI@2
            displayName: Plan and check the exact six creations (no Apply)
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: $(Build.SourcesDirectory)
              inlineScript: |
                set -euo pipefail
                umask 077
                PLAN_DIR="$(mktemp -d "$(Agent.TempDirectory)/applications-preview.XXXXXXXX")"
                trap 'rm -rf -- "$PLAN_DIR"' EXIT
                export ARM_USE_OIDC=true ARM_USE_AZUREAD=true ARM_USE_CLI=false
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                export ARM_OIDC_TOKEN="$idToken"
                export TF_VAR_confluent_cloud_api_key="$CONFLUENT_CLOUD_API_KEY"
                export TF_VAR_confluent_cloud_api_secret="$CONFLUENT_CLOUD_API_SECRET"
                export TF_VAR_kafka_api_key="$PLATFORM_KAFKA_API_KEY"
                export TF_VAR_kafka_api_secret="$PLATFORM_KAFKA_API_SECRET"
                terraform -chdir=environments/${{ parameters.environment }} init -input=false -lockfile=readonly \
                  -backend-config=use_cli=false -backend-config=use_oidc=true -backend-config=use_azuread_auth=true
                terraform -chdir=environments/${{ parameters.environment }} plan -input=false -no-color -lock-timeout=5m \
                  -var=deploy_application_resources=true -out="$PLAN_DIR/tfplan"
                terraform -chdir=environments/${{ parameters.environment }} show -json "$PLAN_DIR/tfplan" > "$PLAN_DIR/plan.json"
                export PLAN_JSON="$PLAN_DIR/plan.json"
                python3 - <<'PYCODE'
                import json, os, sys
                expected = {
                    'terraform_data.application_deployment_guard[0]',
                    'module.topics.confluent_kafka_topic.this["orders"]',
                    'module.topics.confluent_kafka_topic.this["payments"]',
                    'module.acls.confluent_kafka_acl.this["application_orders_read"]',
                    'module.acls.confluent_kafka_acl.this["application_orders_write"]',
                    'module.acls.confluent_kafka_acl.this["application_consumer_group_read"]',
                }
                with open(os.environ['PLAN_JSON'], encoding='utf-8') as f:
                    plan = json.load(f)
                changes = {}
                for r in plan.get('resource_changes', []):
                    actions = r.get('change', {}).get('actions', [])
                    if actions not in (['no-op'], ['read']):
                        changes[r['address']] = actions
                for address, actions in sorted(changes.items()):
                    print(f'Planned: {address}: {actions}')
                if set(changes) != expected or any(a != ['create'] for a in changes.values()):
                    print('##vso[task.logissue type=error]Blocked: expected exactly the six creations and nothing else.')
                    sys.exit(1)
                print('PASS: exactly six creations; nothing applied in this stage.')
                PYCODE
                echo 'No Terraform Apply executed.'
            env:
              CONFLUENT_CLOUD_API_KEY: $(confluent-cloud-api-key)
              CONFLUENT_CLOUD_API_SECRET: $(confluent-cloud-api-secret)
              PLATFORM_KAFKA_API_KEY: $(${{ parameters.environment }}-platform-kafka-api-key)
              PLATFORM_KAFKA_API_SECRET: $(${{ parameters.environment }}-platform-kafka-api-secret)

  - ${{ if eq(parameters.enableApply, true) }}:
      - stage: Apply
        displayName: Approved apply of ${{ parameters.environment }}
        dependsOn: Preview
        jobs:
          - deployment: Deploy
            displayName: Deploy ${{ parameters.environment }} topics and ACLs after approval
            environment: confluent-${{ parameters.environment }}
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                    - bash: |
                        set -euo pipefail
                        VERSION="$(terraformVersion)"
                        curl --fail --silent --show-error --location --retry 3 -o terraform.zip \
                          "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
                        unzip -q terraform.zip terraform
                        sudo install terraform /usr/local/bin/terraform
                        rm -f terraform.zip terraform
                        terraform fmt -check -recursive
                        terraform -chdir=environments/${{ parameters.environment }} init -backend=false -input=false -lockfile=readonly
                        terraform -chdir=environments/${{ parameters.environment }} validate -no-color
                      displayName: Install Terraform and validate
                    - task: AzureKeyVault@2
                      displayName: Retrieve credentials from Key Vault
                      inputs:
                        azureSubscription: $(azureServiceConnection)
                        KeyVaultName: $(keyVaultName)
                        SecretsFilter: confluent-cloud-api-key,confluent-cloud-api-secret,${{ parameters.environment }}-platform-kafka-api-key,${{ parameters.environment }}-platform-kafka-api-secret
                        RunAsPreJob: false
                    - task: AzureCLI@2
                      displayName: Re-check the plan and apply
                      inputs:
                        azureSubscription: $(azureServiceConnection)
                        scriptType: bash
                        scriptLocation: inlineScript
                        addSpnToEnvironment: true
                        workingDirectory: $(Build.SourcesDirectory)
                        inlineScript: |
                          set -euo pipefail
                          umask 077
                          PLAN_DIR="$(mktemp -d "$(Agent.TempDirectory)/applications-apply.XXXXXXXX")"
                          trap 'rm -rf -- "$PLAN_DIR"' EXIT
                          export ARM_USE_OIDC=true ARM_USE_AZUREAD=true ARM_USE_CLI=false
                          export ARM_CLIENT_ID="$servicePrincipalId"
                          export ARM_TENANT_ID="$tenantId"
                          export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                          export ARM_OIDC_TOKEN="$idToken"
                          export TF_VAR_confluent_cloud_api_key="$CONFLUENT_CLOUD_API_KEY"
                          export TF_VAR_confluent_cloud_api_secret="$CONFLUENT_CLOUD_API_SECRET"
                          export TF_VAR_kafka_api_key="$PLATFORM_KAFKA_API_KEY"
                          export TF_VAR_kafka_api_secret="$PLATFORM_KAFKA_API_SECRET"
                          terraform -chdir=environments/${{ parameters.environment }} init -input=false -lockfile=readonly \
                            -backend-config=use_cli=false -backend-config=use_oidc=true -backend-config=use_azuread_auth=true
                          terraform -chdir=environments/${{ parameters.environment }} plan -input=false -no-color -lock-timeout=5m \
                            -var=deploy_application_resources=true -out="$PLAN_DIR/tfplan"
                          terraform -chdir=environments/${{ parameters.environment }} show -json "$PLAN_DIR/tfplan" > "$PLAN_DIR/plan.json"
                          export PLAN_JSON="$PLAN_DIR/plan.json"
                          python3 - <<'PYCODE'
                          import json, os, sys
                          expected = {
                              'terraform_data.application_deployment_guard[0]',
                              'module.topics.confluent_kafka_topic.this["orders"]',
                              'module.topics.confluent_kafka_topic.this["payments"]',
                              'module.acls.confluent_kafka_acl.this["application_orders_read"]',
                              'module.acls.confluent_kafka_acl.this["application_orders_write"]',
                              'module.acls.confluent_kafka_acl.this["application_consumer_group_read"]',
                          }
                          with open(os.environ['PLAN_JSON'], encoding='utf-8') as f:
                              plan = json.load(f)
                          changes = {}
                          for r in plan.get('resource_changes', []):
                              actions = r.get('change', {}).get('actions', [])
                              if actions not in (['no-op'], ['read']):
                                  changes[r['address']] = actions
                          for address, actions in sorted(changes.items()):
                              print(f'Planned: {address}: {actions}')
                          if set(changes) != expected or any(a != ['create'] for a in changes.values()):
                              print('##vso[task.logissue type=error]Blocked: expected exactly the six creations and nothing else.')
                              sys.exit(1)
                          print('PASS: exactly six creations; applying the saved plan.')
                          PYCODE
                          terraform -chdir=environments/${{ parameters.environment }} apply -input=false -no-color "$PLAN_DIR/tfplan"
                          echo 'PASS: approved apply finished.'
                      env:
                        CONFLUENT_CLOUD_API_KEY: $(confluent-cloud-api-key)
                        CONFLUENT_CLOUD_API_SECRET: $(confluent-cloud-api-secret)
                        PLATFORM_KAFKA_API_KEY: $(${{ parameters.environment }}-platform-kafka-api-key)
                        PLATFORM_KAFKA_API_SECRET: $(${{ parameters.environment }}-platform-kafka-api-secret)
