
# Manual-only, approval-gated DEV Kafka topics and ACLs deployment.
name: applications-dev-resources-apply-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

parameters:
- name: enableApply
  displayName: Enable DEV Terraform Apply
  type: boolean
  default: false

- name: schemaDeployment
  displayName: Deploy DEV orders schema only
  type: boolean
  default: false

pool:
  vmImage: ubuntu-24.04

variables:
  terraformVersion: '1.17.1'
  azureServiceConnection: azure-confluent-service-connection
  keyVaultName: kv-confluent-example

stages:
- stage: DevApplicationApply
  displayName: Approved DEV Kafka resources deployment
  condition: and(succeeded(), eq('${{ parameters.enableApply }}', 'true'), eq('${{ parameters.schemaDeployment }}', 'false'))

  jobs:
  - deployment: ApplyDevResources
    displayName: Verify plan and apply six DEV resources
    environment: confluent-dev

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - bash: |
              set -euo pipefail
              VERSION="$(terraformVersion)"

              curl --fail --silent --show-error --location --retry 3 \
                -o terraform.zip \
                "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"

              unzip -q terraform.zip terraform
              sudo install terraform /usr/local/bin/terraform
              rm -f terraform.zip terraform

              terraform version
              terraform fmt -check -recursive

              terraform -chdir=environments/dev init \
                -backend=false -input=false -lockfile=readonly

              terraform -chdir=environments/dev validate -no-color
            displayName: Install Terraform and validate DEV

          - task: AzureKeyVault@2
            displayName: Retrieve DEV credentials from Key Vault
            inputs:
              azureSubscription: $(azureServiceConnection)
              KeyVaultName: $(keyVaultName)
              SecretsFilter: confluent-cloud-api-key,confluent-cloud-api-secret,dev-platform-kafka-api-key,dev-platform-kafka-api-secret
              RunAsPreJob: false

          - task: AzureCLI@2
            displayName: Verify exact DEV plan and execute Apply
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: $(Build.SourcesDirectory)
              inlineScript: |
                set -euo pipefail
                umask 077

                PLAN_DIR="$(mktemp -d "$(Agent.TempDirectory)/applications-dev-apply.XXXXXXXX")"
                trap 'rm -rf -- "$PLAN_DIR"' EXIT

                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true
                export ARM_USE_CLI=false
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                export ARM_OIDC_TOKEN="$idToken"

                export TF_VAR_confluent_cloud_api_key="$CONFLUENT_CLOUD_API_KEY"
                export TF_VAR_confluent_cloud_api_secret="$CONFLUENT_CLOUD_API_SECRET"
                export TF_VAR_kafka_api_key="$PLATFORM_KAFKA_API_KEY"
                export TF_VAR_kafka_api_secret="$PLATFORM_KAFKA_API_SECRET"

                terraform -chdir=environments/dev init \
                  -input=false -lockfile=readonly \
                  -backend-config=use_cli=false \
                  -backend-config=use_oidc=true \
                  -backend-config=use_azuread_auth=true

                terraform -chdir=environments/dev plan \
                  -input=false -no-color \
                  -var=deploy_application_resources=true \
                  -out="$PLAN_DIR/tfplan"

                terraform -chdir=environments/dev show \
                  -json "$PLAN_DIR/tfplan" > "$PLAN_DIR/plan.json"

                export PLAN_JSON="$PLAN_DIR/plan.json"

                python3 - <<'PYCODE'
                import json
                import os
                import sys

                expected = {
                    'terraform_data.application_deployment_guard[0]',
                    'module.topics.confluent_kafka_topic.this["orders"]',
                    'module.topics.confluent_kafka_topic.this["payments"]',
                    'module.acls.confluent_kafka_acl.this["application_orders_read"]',
                    'module.acls.confluent_kafka_acl.this["application_orders_write"]',
                    'module.acls.confluent_kafka_acl.this["application_consumer_group_read"]',
                }

                with open(os.environ["PLAN_JSON"], encoding="utf-8") as f:
                    plan = json.load(f)

                changes = {}

                for resource in plan.get("resource_changes", []):
                    actions = resource.get("change", {}).get("actions", [])

                    if actions not in (["no-op"], ["read"]):
                        changes[resource["address"]] = actions

                for address, actions in sorted(changes.items()):
                    print(f"Resource change: {address}: {','.join(actions)}")

                if (
                    set(changes) != expected
                    or any(actions != ["create"] for actions in changes.values())
                ):
                    print(
                        "##vso[task.logissue type=error]"
                        "Blocked: expected exactly six DEV creations "
                        "and no other changes."
                    )
                    sys.exit(1)

                print(
                    "PASS: exactly six DEV resource creations; "
                    "no changes or destroys."
                )
                PYCODE

                terraform -chdir=environments/dev apply \
                  -input=false -no-color "$PLAN_DIR/tfplan"

                echo "PASS: Approved DEV Terraform Apply finished."

            env:
              CONFLUENT_CLOUD_API_KEY: $(confluent-cloud-api-key)
              CONFLUENT_CLOUD_API_SECRET: $(confluent-cloud-api-secret)
              PLATFORM_KAFKA_API_KEY: $(dev-platform-kafka-api-key)
              PLATFORM_KAFKA_API_SECRET: $(dev-platform-kafka-api-secret)


- stage: DevSchemaDeployment
  displayName: Approved DEV Schema Registry deployment
  dependsOn: []
  condition: and(succeeded(), eq('${{ parameters.enableApply }}', 'true'), eq('${{ parameters.schemaDeployment }}', 'true'))
  jobs:
  - deployment: ApplyDevSchema
    displayName: Register dev.orders-value
    environment: confluent-dev
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - bash: |
              set -euo pipefail
              VERSION="$(terraformVersion)"
              curl --fail --silent --show-error --location --retry 3 -o terraform.zip "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
              unzip -q terraform.zip terraform
              sudo install terraform /usr/local/bin/terraform
              rm -f terraform.zip terraform
              terraform fmt -check -recursive
              terraform -chdir=environments/dev init -backend=false -input=false -lockfile=readonly
              terraform -chdir=environments/dev validate -no-color
            displayName: Install and validate Terraform

          - task: AzureKeyVault@2
            displayName: Retrieve DEV and Schema Registry credentials
            inputs:
              azureSubscription: $(azureServiceConnection)
              KeyVaultName: $(keyVaultName)
              SecretsFilter: confluent-cloud-api-key,confluent-cloud-api-secret,dev-platform-kafka-api-key,dev-platform-kafka-api-secret,dev-schema-registry-api-key,dev-schema-registry-api-secret
              RunAsPreJob: false

          - task: AzureCLI@2
            displayName: Plan, verify and register DEV schema
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: $(Build.SourcesDirectory)
              inlineScript: |
                set -euo pipefail
                umask 077

                PLAN_DIR="$(mktemp -d "$(Agent.TempDirectory)/schema-dev.XXXXXXXX")"
                trap 'rm -rf -- "$PLAN_DIR"' EXIT

                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true
                export ARM_USE_CLI=false
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                export ARM_OIDC_TOKEN="$idToken"

                export TF_VAR_confluent_cloud_api_key="$CONFLUENT_CLOUD_API_KEY"
                export TF_VAR_confluent_cloud_api_secret="$CONFLUENT_CLOUD_API_SECRET"
                export TF_VAR_kafka_api_key="$PLATFORM_KAFKA_API_KEY"
                export TF_VAR_kafka_api_secret="$PLATFORM_KAFKA_API_SECRET"
                export TF_VAR_schema_registry_api_key="$DEV_SR_API_KEY"
                export TF_VAR_schema_registry_api_secret="$DEV_SR_API_SECRET"

                terraform -chdir=environments/dev init                   -input=false -lockfile=readonly                   -backend-config=use_cli=false                   -backend-config=use_oidc=true                   -backend-config=use_azuread_auth=true

                terraform -chdir=environments/dev plan                   -input=false -no-color                   -var=deploy_application_resources=true                   -var=deploy_schemas=true                   -out="$PLAN_DIR/tfplan"

                terraform -chdir=environments/dev show                   -json "$PLAN_DIR/tfplan" > "$PLAN_DIR/plan.json"

                export PLAN_JSON="$PLAN_DIR/plan.json"

                python3 - <<'PYCODE'
                import json
                import os
                import sys

                with open(os.environ["PLAN_JSON"], encoding="utf-8") as f:
                    plan = json.load(f)

                expected = {
                    "terraform_data.schema_deployment_guard[0]",
                    "confluent_schema.orders_value[0]",
                }

                changes = {}
                for resource in plan.get("resource_changes", []):
                    actions = resource.get("change", {}).get("actions", [])
                    if actions not in (["no-op"], ["read"]):
                        changes[resource["address"]] = actions

                for address, actions in sorted(changes.items()):
                    print(f"PLAN: {address}: {actions}")

                if set(changes) != expected or any(
                    actions != ["create"] for actions in changes.values()
                ):
                    print("BLOCKED: Expected exactly two schema-related creations.")
                    sys.exit(1)

                print("PASS: Only DEV schema and deployment guard will be created.")
                PYCODE

                terraform -chdir=environments/dev apply                   -input=false -no-color "$PLAN_DIR/tfplan"

                echo "PASS: DEV Schema Registry Terraform Apply completed."

            env:
              CONFLUENT_CLOUD_API_KEY: $(confluent-cloud-api-key)
              CONFLUENT_CLOUD_API_SECRET: $(confluent-cloud-api-secret)
              PLATFORM_KAFKA_API_KEY: $(dev-platform-kafka-api-key)
              PLATFORM_KAFKA_API_SECRET: $(dev-platform-kafka-api-secret)
              DEV_SR_API_KEY: $(dev-schema-registry-api-key)
              DEV_SR_API_SECRET: $(dev-schema-registry-api-secret)
