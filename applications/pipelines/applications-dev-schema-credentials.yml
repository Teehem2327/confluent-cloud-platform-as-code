# DEV: refresh the Schema Registry credentials stored in Terraform state after the key was rotated.
# Stage 1 is a plan-only preview. Stage 2 (enableApply) waits for the confluent-dev approval and
# proceeds only if the plan is one in-place update of confluent_schema.orders_value[0] that changes
# nothing except the stored credentials. It never changes the subject, schema or any other resource.
name: confluent-applications-dev-schema-credentials-$(Date:yyyyMMdd)$(Rev:.r)
trigger: none
pr: none

parameters:
  - name: enableApply
    displayName: 'Refresh the stored Schema Registry credentials'
    type: boolean
    default: false

pool:
  vmImage: ubuntu-24.04

variables:
  terraformVersion: '1.17.1'
  azureServiceConnection: azure-confluent-service-connection
  keyVaultName: kv-confluent-example

stages:
  - stage: Preview
    displayName: Plan-only credentials preview
    jobs:
      - job: PlanOnly
        steps:
          - checkout: self
          - bash: |
              set -euo pipefail
              VERSION="$(terraformVersion)"
              curl --fail --silent --show-error --location --retry 3 -o terraform.zip \
                "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
              unzip -q terraform.zip terraform
              sudo install terraform /usr/local/bin/terraform
              rm -f terraform.zip terraform
              terraform fmt -check -recursive
              terraform -chdir=environments/dev init -backend=false -input=false -lockfile=readonly
              terraform -chdir=environments/dev validate -no-color
            displayName: Install and validate Terraform
          - task: AzureKeyVault@2
            displayName: Retrieve DEV and Schema Registry credentials
            inputs:
              azureSubscription: $(azureServiceConnection)
              KeyVaultName: $(keyVaultName)
              SecretsFilter: confluent-cloud-api-key,confluent-cloud-api-secret,dev-platform-kafka-api-key,dev-platform-kafka-api-secret,dev-schema-registry-api-key,dev-schema-registry-api-secret
              RunAsPreJob: false
          - task: AzureCLI@2
            displayName: Plan and verify a credentials-only schema update (no Apply)
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: $(Build.SourcesDirectory)
              inlineScript: |
                set -euo pipefail
                umask 077
                PLAN_DIR="$(mktemp -d "$(Agent.TempDirectory)/schema-creds.XXXXXXXX")"
                trap 'rm -rf -- "$PLAN_DIR"' EXIT
                export ARM_USE_OIDC=true ARM_USE_AZUREAD=true ARM_USE_CLI=false
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                export ARM_OIDC_TOKEN="$idToken"
                export TF_VAR_confluent_cloud_api_key="$CONFLUENT_CLOUD_API_KEY"
                export TF_VAR_confluent_cloud_api_secret="$CONFLUENT_CLOUD_API_SECRET"
                export TF_VAR_kafka_api_key="$PLATFORM_KAFKA_API_KEY"
                export TF_VAR_kafka_api_secret="$PLATFORM_KAFKA_API_SECRET"
                export TF_VAR_schema_registry_api_key="$DEV_SR_API_KEY"
                export TF_VAR_schema_registry_api_secret="$DEV_SR_API_SECRET"
                terraform -chdir=environments/dev init -input=false -lockfile=readonly \
                  -backend-config=use_cli=false -backend-config=use_oidc=true \
                  -backend-config=use_azuread_auth=true
                terraform -chdir=environments/dev plan -input=false -no-color -lock-timeout=5m \
                  -var=deploy_application_resources=true \
                  -var=deploy_schemas=true \
                  -out="$PLAN_DIR/tfplan"
                terraform -chdir=environments/dev show -json "$PLAN_DIR/tfplan" > "$PLAN_DIR/plan.json"
                export PLAN_JSON="$PLAN_DIR/plan.json"
                python3 - <<'PYCODE'
                import json, os, sys
                with open(os.environ['PLAN_JSON'], encoding='utf-8') as f:
                    plan = json.load(f)
                expected = 'confluent_schema.orders_value[0]'
                changes = [
                    (r.get('address'), r.get('type'), r.get('change', {}).get('actions', []))
                    for r in plan.get('resource_changes', [])
                    if r.get('change', {}).get('actions', []) not in (['no-op'], ['read'])
                ]
                for address, resource_type, actions in changes:
                    print(f'Resource change: {address}: {actions}')
                if changes != [(expected, 'confluent_schema', ['update'])]:
                    print('##vso[task.logissue type=error]Plan is not exactly one in-place schema update; Apply blocked.')
                    sys.exit(1)
                change = next(r.get('change', {}) for r in plan.get('resource_changes', [])
                              if r.get('address') == expected)
                before = change.get('before') or {}
                after = change.get('after') or {}
                other_diffs = sorted(k for k in after
                                     if k != 'credentials' and k in before and before[k] != after[k])
                same_schema = (before.get('schema') == after.get('schema')
                               and before.get('subject_name') == after.get('subject_name')
                               and before.get('format') == after.get('format')
                               and after.get('subject_name') == 'dev.orders-value')
                if other_diffs or not same_schema:
                    print('##vso[task.logissue type=error]Update changes more than credentials: ' + ', '.join(other_diffs or ['schema']))
                    sys.exit(1)
                print('PASS: only the stored Schema Registry credentials change; subject, format and schema are identical.')
                PYCODE
                echo 'Preview only: nothing was applied.'
            env:
              CONFLUENT_CLOUD_API_KEY: $(confluent-cloud-api-key)
              CONFLUENT_CLOUD_API_SECRET: $(confluent-cloud-api-secret)
              PLATFORM_KAFKA_API_KEY: $(dev-platform-kafka-api-key)
              PLATFORM_KAFKA_API_SECRET: $(dev-platform-kafka-api-secret)
              DEV_SR_API_KEY: $(dev-schema-registry-api-key)
              DEV_SR_API_SECRET: $(dev-schema-registry-api-secret)

  - ${{ if eq(parameters.enableApply, true) }}:
      - stage: ApprovedCredentialRefresh
        displayName: Manually approved credentials refresh
        dependsOn: Preview
        jobs:
          - deployment: RefreshSchemaCredentials
            displayName: Review, approve, then refresh credentials
            environment: confluent-dev
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                    - bash: |
                        set -euo pipefail
                        VERSION="$(terraformVersion)"
                        curl --fail --silent --show-error --location --retry 3 -o terraform.zip \
                          "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
                        unzip -q terraform.zip terraform
                        sudo install terraform /usr/local/bin/terraform
                        rm -f terraform.zip terraform
                        terraform fmt -check -recursive
                        terraform -chdir=environments/dev init -backend=false -input=false -lockfile=readonly
                        terraform -chdir=environments/dev validate -no-color
                      displayName: Install and validate Terraform
                    - task: AzureKeyVault@2
                      displayName: Retrieve DEV and Schema Registry credentials
                      inputs:
                        azureSubscription: $(azureServiceConnection)
                        KeyVaultName: $(keyVaultName)
                        SecretsFilter: confluent-cloud-api-key,confluent-cloud-api-secret,dev-platform-kafka-api-key,dev-platform-kafka-api-secret,dev-schema-registry-api-key,dev-schema-registry-api-secret
                        RunAsPreJob: false
                    - task: AzureCLI@2
                      displayName: Verify exact plan and refresh stored credentials
                      inputs:
                        azureSubscription: $(azureServiceConnection)
                        scriptType: bash
                        scriptLocation: inlineScript
                        addSpnToEnvironment: true
                        workingDirectory: $(Build.SourcesDirectory)
                        inlineScript: |
                          set -euo pipefail
                          umask 077
                          PLAN_DIR="$(mktemp -d "$(Agent.TempDirectory)/schema-creds.XXXXXXXX")"
                          trap 'rm -rf -- "$PLAN_DIR"' EXIT
                          export ARM_USE_OIDC=true ARM_USE_AZUREAD=true ARM_USE_CLI=false
                          export ARM_CLIENT_ID="$servicePrincipalId"
                          export ARM_TENANT_ID="$tenantId"
                          export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                          export ARM_OIDC_TOKEN="$idToken"
                          export TF_VAR_confluent_cloud_api_key="$CONFLUENT_CLOUD_API_KEY"
                          export TF_VAR_confluent_cloud_api_secret="$CONFLUENT_CLOUD_API_SECRET"
                          export TF_VAR_kafka_api_key="$PLATFORM_KAFKA_API_KEY"
                          export TF_VAR_kafka_api_secret="$PLATFORM_KAFKA_API_SECRET"
                          export TF_VAR_schema_registry_api_key="$DEV_SR_API_KEY"
                          export TF_VAR_schema_registry_api_secret="$DEV_SR_API_SECRET"
                          terraform -chdir=environments/dev init -input=false -lockfile=readonly \
                            -backend-config=use_cli=false -backend-config=use_oidc=true \
                            -backend-config=use_azuread_auth=true
                          terraform -chdir=environments/dev plan -input=false -no-color -lock-timeout=5m \
                            -var=deploy_application_resources=true \
                            -var=deploy_schemas=true \
                            -out="$PLAN_DIR/tfplan"
                          terraform -chdir=environments/dev show -json "$PLAN_DIR/tfplan" > "$PLAN_DIR/plan.json"
                          export PLAN_JSON="$PLAN_DIR/plan.json"
                          python3 - <<'PYCODE'
                          import json, os, sys
                          with open(os.environ['PLAN_JSON'], encoding='utf-8') as f:
                              plan = json.load(f)
                          expected = 'confluent_schema.orders_value[0]'
                          changes = [
                              (r.get('address'), r.get('type'), r.get('change', {}).get('actions', []))
                              for r in plan.get('resource_changes', [])
                              if r.get('change', {}).get('actions', []) not in (['no-op'], ['read'])
                          ]
                          for address, resource_type, actions in changes:
                              print(f'Resource change: {address}: {actions}')
                          if changes != [(expected, 'confluent_schema', ['update'])]:
                              print('##vso[task.logissue type=error]Plan is not exactly one in-place schema update; Apply blocked.')
                              sys.exit(1)
                          change = next(r.get('change', {}) for r in plan.get('resource_changes', [])
                                        if r.get('address') == expected)
                          before = change.get('before') or {}
                          after = change.get('after') or {}
                          other_diffs = sorted(k for k in after
                                               if k != 'credentials' and k in before and before[k] != after[k])
                          same_schema = (before.get('schema') == after.get('schema')
                                         and before.get('subject_name') == after.get('subject_name')
                                         and before.get('format') == after.get('format')
                                         and after.get('subject_name') == 'dev.orders-value')
                          if other_diffs or not same_schema:
                              print('##vso[task.logissue type=error]Update changes more than credentials: ' + ', '.join(other_diffs or ['schema']))
                              sys.exit(1)
                          print('PASS: only the stored Schema Registry credentials change; subject, format and schema are identical.')
                          PYCODE
                          terraform -chdir=environments/dev apply -input=false -no-color "$PLAN_DIR/tfplan"
                          echo 'Stored Schema Registry credentials refreshed.'
                      env:
                        CONFLUENT_CLOUD_API_KEY: $(confluent-cloud-api-key)
                        CONFLUENT_CLOUD_API_SECRET: $(confluent-cloud-api-secret)
                        PLATFORM_KAFKA_API_KEY: $(dev-platform-kafka-api-key)
                        PLATFORM_KAFKA_API_SECRET: $(dev-platform-kafka-api-secret)
                        DEV_SR_API_KEY: $(dev-schema-registry-api-key)
                        DEV_SR_API_SECRET: $(dev-schema-registry-api-secret)
