# Platform CD: safe, plan-only. No saved plans published. No Apply anywhere.
name: confluent-platform-cd-$(Date:yyyyMMdd)$(Rev:.r)
trigger: none
pr: none
parameters:
  - name: environment
    displayName: Environment to validate
    type: string
    default: dev
    values: [dev, test, prod]
pool:
  vmImage: ubuntu-24.04
variables:
  terraformVersion: '1.17.1'
  azureServiceConnection: azure-confluent-service-connection
  keyVaultName: kv-confluent-example
stages:
  - stage: StaticValidation
    jobs:
      - job: Validate
        steps:
          - checkout: self
          - bash: |
              set -euo pipefail
              VERSION="$(terraformVersion)"
              curl --fail --silent --show-error --location --retry 3 -o terraform.zip \
                "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
              unzip -q terraform.zip terraform
              sudo install terraform /usr/local/bin/terraform
              rm -f terraform.zip terraform
              terraform fmt -check -recursive
              for env in dev test prod; do
                terraform -chdir="environments/$env" init -backend=false -input=false -lockfile=readonly
                terraform -chdir="environments/$env" validate -no-color
              done
              echo 'Validated DEV TEST PROD. No Apply.'
            displayName: Validate all environments
  # Only DEV has an initialized, previously approved Platform state.
  # TEST/PROD are validated statically; no remote state is created.
  - ${{ if eq(parameters.environment, 'dev') }}:
      - stage: DevPlan
        dependsOn: StaticValidation
        condition: succeeded()
        jobs:
          - job: Plan
            steps:
              - checkout: self
              - bash: |
                  set -euo pipefail
                  VERSION="$(terraformVersion)"
                  curl --fail --silent --show-error --location --retry 3 -o terraform.zip \
                    "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
                  unzip -q terraform.zip terraform
                  sudo install terraform /usr/local/bin/terraform
                  rm -f terraform.zip terraform
                displayName: Install Terraform
              - task: AzureKeyVault@2
                inputs:
                  azureSubscription: $(azureServiceConnection)
                  KeyVaultName: $(keyVaultName)
                  SecretsFilter: confluent-cloud-api-key,confluent-cloud-api-secret
                  RunAsPreJob: false
                displayName: Retrieve credentials
              - task: AzureCLI@2
                displayName: DEV plan with zero-change safety gate
                inputs:
                  azureSubscription: $(azureServiceConnection)
                  scriptType: bash
                  scriptLocation: inlineScript
                  addSpnToEnvironment: true
                  workingDirectory: $(Build.SourcesDirectory)
                  inlineScript: |
                    set -euo pipefail
                    umask 077
                    PLAN_DIR="$(mktemp -d "$(Agent.TempDirectory)/platform-plan.XXXXXXXX")"
                    trap 'rm -rf -- "$PLAN_DIR"' EXIT
                    export ARM_USE_OIDC=true ARM_USE_AZUREAD=true ARM_USE_CLI=false
                    export ARM_CLIENT_ID="$servicePrincipalId"
                    export ARM_TENANT_ID="$tenantId"
                    export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                    export ARM_OIDC_TOKEN="$idToken"
                    export TF_VAR_confluent_cloud_api_key="$CONFLUENT_CLOUD_API_KEY"
                    export TF_VAR_confluent_cloud_api_secret="$CONFLUENT_CLOUD_API_SECRET"
                    terraform -chdir=environments/dev init -input=false -lockfile=readonly \
                      -backend-config=use_cli=false -backend-config=use_oidc=true \
                      -backend-config=use_azuread_auth=true
                    terraform -chdir=environments/dev plan -input=false \
                      -var=deploy_kafka_cluster=true \
                      -var=deploy_service_accounts=true \
                      -var=deploy_rbac=true -out="$PLAN_DIR/tfplan"
                    terraform -chdir=environments/dev show -json "$PLAN_DIR/tfplan" > "$PLAN_DIR/plan.json"
                    export PLAN_JSON="$PLAN_DIR/plan.json"
                    python3 - <<'PYCODE'
                    import json, os, sys
                    with open(os.environ['PLAN_JSON'], encoding='utf-8') as f:
                        plan = json.load(f)
                    changes = [(r.get('address'), r.get('change', {}).get('actions', []))
                               for r in plan.get('resource_changes', [])
                               if r.get('change', {}).get('actions', []) not in (['no-op'], ['read'])]
                    print(f'Platform DEV resource changes: {len(changes)}')
                    if changes:
                        print('##vso[task.logissue type=error]Plan includes infrastructure changes; blocked.')
                        sys.exit(1)
                    print('Safety gate passed: zero infrastructure resource changes.')
                    PYCODE
                    echo 'No Terraform Apply executed.'
                env:
                  CONFLUENT_CLOUD_API_KEY: $(confluent-cloud-api-key)
                  CONFLUENT_CLOUD_API_SECRET: $(confluent-cloud-api-secret)

  # SAFE_ENVIRONMENT_APPROVAL_GATE_V1
  # TEST/PROD are approval-controlled validation gates only. No plan or Apply.
  - ${{ if ne(parameters.environment, 'dev') }}:
      - stage: EnvironmentApproval
        displayName: Approval gate for ${{ parameters.environment }} (no Apply)
        dependsOn: StaticValidation
        condition: succeeded()
        jobs:
          - deployment: ReviewEnvironment
            displayName: Review ${{ parameters.environment }} configuration
            environment: confluent-${{ parameters.environment }}
            strategy:
              runOnce:
                deploy:
                  steps:
                    - bash: |
                        set -euo pipefail
                        echo 'Environment approval completed.'
                        echo 'This is validation only: no Terraform plan or Apply.'
                      displayName: Confirm plan-only gate
