# DEV ksqlDB cluster. Stage 1 is a plan-only preview (no approval needed, nothing is applied).
# Stage 2 runs only when enableApply is true and then waits for the confluent-dev approval.
# ksqlDB is billed hourly while the cluster exists. It never touches Kafka topics, schemas or keys.
name: confluent-platform-dev-ksqldb-$(Date:yyyyMMdd)$(Rev:.r)
trigger: none
pr: none

parameters:
  - name: enableApply
    displayName: 'I accepted the hourly ksqlDB cost and authorize creating the DEV ksqlDB cluster'
    type: boolean
    default: false

pool:
  vmImage: ubuntu-24.04

variables:
  terraformVersion: '1.17.1'
  azureServiceConnection: azure-confluent-service-connection
  keyVaultName: kv-confluent-example

stages:
  - stage: Preview
    displayName: Plan-only ksqlDB preview
    jobs:
      - job: PlanOnly
        steps:
          - checkout: self
          - bash: |
              set -euo pipefail
              VERSION="$(terraformVersion)"
              curl --fail --silent --show-error --location --retry 3 -o terraform.zip \
                "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
              unzip -q terraform.zip terraform
              sudo install terraform /usr/local/bin/terraform
              rm -f terraform.zip terraform
              terraform -chdir=environments/dev fmt -check
              terraform -chdir=environments/dev init -backend=false -input=false -lockfile=readonly
              terraform -chdir=environments/dev validate -no-color
            displayName: Install and validate Terraform
          - task: AzureKeyVault@2
            displayName: Retrieve Confluent Cloud credentials
            inputs:
              azureSubscription: $(azureServiceConnection)
              KeyVaultName: $(keyVaultName)
              SecretsFilter: confluent-cloud-api-key,confluent-cloud-api-secret
              RunAsPreJob: false
          - task: AzureCLI@2
            displayName: Plan and verify exactly one new ksqlDB cluster (no Apply)
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: $(Build.SourcesDirectory)
              inlineScript: |
                set -euo pipefail
                umask 077
                PLAN_DIR="$(mktemp -d "$(Agent.TempDirectory)/dev-ksql.XXXXXXXX")"
                trap 'rm -rf -- "$PLAN_DIR"' EXIT
                export ARM_USE_OIDC=true ARM_USE_AZUREAD=true ARM_USE_CLI=false
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                export ARM_OIDC_TOKEN="$idToken"
                export TF_VAR_confluent_cloud_api_key="$CONFLUENT_CLOUD_API_KEY"
                export TF_VAR_confluent_cloud_api_secret="$CONFLUENT_CLOUD_API_SECRET"
                terraform -chdir=environments/dev init -input=false -lockfile=readonly \
                  -backend-config=use_cli=false -backend-config=use_oidc=true \
                  -backend-config=use_azuread_auth=true
                terraform -chdir=environments/dev plan -input=false -no-color -lock-timeout=5m \
                  -var=deploy_kafka_cluster=true \
                  -var=deploy_service_accounts=true \
                  -var=deploy_rbac=true \
                  -var=deploy_kafka_api_keys=true \
                  -var=deploy_ksqldb=true \
                  -var=ksqldb_csu=4 \
                  -out="$PLAN_DIR/tfplan"
                terraform -chdir=environments/dev show -json "$PLAN_DIR/tfplan" > "$PLAN_DIR/plan.json"
                export PLAN_JSON="$PLAN_DIR/plan.json"
                python3 - <<'PYCODE'
                import json, os, sys
                with open(os.environ['PLAN_JSON'], encoding='utf-8') as f:
                    plan = json.load(f)
                expected = 'confluent_ksql_cluster.dev[0]'
                changes = [
                    (r.get('address'), r.get('type'), r.get('change', {}).get('actions', []))
                    for r in plan.get('resource_changes', [])
                    if r.get('change', {}).get('actions', []) not in (['no-op'], ['read'])
                ]
                for address, resource_type, actions in changes:
                    print(f'Resource change: {address}: {actions}')
                if changes != [(expected, 'confluent_ksql_cluster', ['create'])]:
                    print('##vso[task.logissue type=error]Plan is not exactly one new ksqlDB cluster; Apply blocked.')
                    sys.exit(1)
                after = next(r.get('change', {}).get('after', {})
                             for r in plan.get('resource_changes', []) if r.get('address') == expected)
                kafka = after.get('kafka_cluster') or []
                env = after.get('environment') or []
                valid = (after.get('display_name') == 'ksql-dev'
                         and after.get('csu') == 4
                         and isinstance(kafka, list) and len(kafka) == 1 and kafka[0].get('id') == 'lkc-xxxxxx'
                         and isinstance(env, list) and len(env) == 1 and env[0].get('id') == 'env-xxxxxx')
                if not valid:
                    print('##vso[task.logissue type=error]ksqlDB cluster configuration mismatch; Apply blocked.')
                    sys.exit(1)
                print('PASS: exactly one new 4-CSU ksqlDB cluster in DEV; nothing else changes.')
                PYCODE
                echo 'Preview only: nothing was applied.'
            env:
              CONFLUENT_CLOUD_API_KEY: $(confluent-cloud-api-key)
              CONFLUENT_CLOUD_API_SECRET: $(confluent-cloud-api-secret)

  - ${{ if eq(parameters.enableApply, true) }}:
      - stage: ApprovedKsqlDeployment
        displayName: Manually approved DEV ksqlDB deployment
        dependsOn: Preview
        jobs:
          - deployment: ApplyKsqlDev
            displayName: Review, approve, then create DEV ksqlDB
            environment: confluent-dev
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                    - bash: |
                        set -euo pipefail
                        VERSION="$(terraformVersion)"
                        curl --fail --silent --show-error --location --retry 3 -o terraform.zip \
                          "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
                        unzip -q terraform.zip terraform
                        sudo install terraform /usr/local/bin/terraform
                        rm -f terraform.zip terraform
                        terraform -chdir=environments/dev fmt -check
                        terraform -chdir=environments/dev init -backend=false -input=false -lockfile=readonly
                        terraform -chdir=environments/dev validate -no-color
                      displayName: Install and validate Terraform
                    - task: AzureKeyVault@2
                      displayName: Retrieve Confluent Cloud credentials
                      inputs:
                        azureSubscription: $(azureServiceConnection)
                        KeyVaultName: $(keyVaultName)
                        SecretsFilter: confluent-cloud-api-key,confluent-cloud-api-secret
                        RunAsPreJob: false
                    - task: AzureCLI@2
                      displayName: Verify exact plan and apply it
                      inputs:
                        azureSubscription: $(azureServiceConnection)
                        scriptType: bash
                        scriptLocation: inlineScript
                        addSpnToEnvironment: true
                        workingDirectory: $(Build.SourcesDirectory)
                        inlineScript: |
                          set -euo pipefail
                          umask 077
                          PLAN_DIR="$(mktemp -d "$(Agent.TempDirectory)/dev-ksql.XXXXXXXX")"
                          trap 'rm -rf -- "$PLAN_DIR"' EXIT
                          export ARM_USE_OIDC=true ARM_USE_AZUREAD=true ARM_USE_CLI=false
                          export ARM_CLIENT_ID="$servicePrincipalId"
                          export ARM_TENANT_ID="$tenantId"
                          export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                          export ARM_OIDC_TOKEN="$idToken"
                          export TF_VAR_confluent_cloud_api_key="$CONFLUENT_CLOUD_API_KEY"
                          export TF_VAR_confluent_cloud_api_secret="$CONFLUENT_CLOUD_API_SECRET"
                          terraform -chdir=environments/dev init -input=false -lockfile=readonly \
                            -backend-config=use_cli=false -backend-config=use_oidc=true \
                            -backend-config=use_azuread_auth=true
                          terraform -chdir=environments/dev plan -input=false -no-color -lock-timeout=5m \
                            -var=deploy_kafka_cluster=true \
                            -var=deploy_service_accounts=true \
                            -var=deploy_rbac=true \
                            -var=deploy_kafka_api_keys=true \
                            -var=deploy_ksqldb=true \
                            -var=ksqldb_csu=4 \
                            -out="$PLAN_DIR/tfplan"
                          terraform -chdir=environments/dev show -json "$PLAN_DIR/tfplan" > "$PLAN_DIR/plan.json"
                          export PLAN_JSON="$PLAN_DIR/plan.json"
                          python3 - <<'PYCODE'
                          import json, os, sys
                          with open(os.environ['PLAN_JSON'], encoding='utf-8') as f:
                              plan = json.load(f)
                          expected = 'confluent_ksql_cluster.dev[0]'
                          changes = [
                              (r.get('address'), r.get('type'), r.get('change', {}).get('actions', []))
                              for r in plan.get('resource_changes', [])
                              if r.get('change', {}).get('actions', []) not in (['no-op'], ['read'])
                          ]
                          for address, resource_type, actions in changes:
                              print(f'Resource change: {address}: {actions}')
                          if changes != [(expected, 'confluent_ksql_cluster', ['create'])]:
                              print('##vso[task.logissue type=error]Plan is not exactly one new ksqlDB cluster; Apply blocked.')
                              sys.exit(1)
                          after = next(r.get('change', {}).get('after', {})
                                       for r in plan.get('resource_changes', []) if r.get('address') == expected)
                          kafka = after.get('kafka_cluster') or []
                          env = after.get('environment') or []
                          valid = (after.get('display_name') == 'ksql-dev'
                                   and after.get('csu') == 4
                                   and isinstance(kafka, list) and len(kafka) == 1 and kafka[0].get('id') == 'lkc-xxxxxx'
                                   and isinstance(env, list) and len(env) == 1 and env[0].get('id') == 'env-xxxxxx')
                          if not valid:
                              print('##vso[task.logissue type=error]ksqlDB cluster configuration mismatch; Apply blocked.')
                              sys.exit(1)
                          print('PASS: exactly one new 4-CSU ksqlDB cluster in DEV; nothing else changes.')
                          PYCODE
                          terraform -chdir=environments/dev apply -input=false -auto-approve "$PLAN_DIR/tfplan"
                          echo 'DEV ksqlDB cluster created; it is billed hourly until it is removed.'
                      env:
                        CONFLUENT_CLOUD_API_KEY: $(confluent-cloud-api-key)
                        CONFLUENT_CLOUD_API_SECRET: $(confluent-cloud-api-secret)
