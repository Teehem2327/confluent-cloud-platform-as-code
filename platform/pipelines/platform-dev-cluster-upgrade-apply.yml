# Manually triggered, DEV-only, approval-gated upgrade of the existing kafka-dev cluster Basic -> Standard.
# The upgrade is IRREVERSIBLE (Confluent does not support cluster type downgrades) and increases cost.
# The apply only proceeds if the saved plan is exactly ONE in-place update of the existing cluster.
name: confluent-platform-dev-cluster-upgrade-$(Date:yyyyMMdd)$(Rev:.r)
trigger: none
pr: none

parameters:
  - name: enableApply
    displayName: 'I accept the cost and that the Basic to Standard upgrade cannot be undone'
    type: boolean
    default: false

pool:
  vmImage: ubuntu-24.04

variables:
  terraformVersion: '1.17.1'
  azureServiceConnection: azure-confluent-service-connection
  keyVaultName: kv-confluent-example

stages:
  - stage: SafetyNotice
    displayName: Upgrade authorization check
    jobs:
      - job: Notice
        steps:
          - bash: |
              echo 'This pipeline upgrades the EXISTING DEV Kafka cluster from Basic to Standard.'
              echo 'The upgrade cannot be undone and Standard costs more than Basic.'
              echo 'It never deploys TEST or PROD and never replaces or destroys any resource.'
              echo 'The enableApply parameter must be explicitly set to true.'
            displayName: Show upgrade scope

  - ${{ if eq(parameters.enableApply, true) }}:
      - stage: ApprovedClusterUpgrade
        displayName: Manually approved DEV cluster upgrade
        dependsOn: SafetyNotice
        jobs:
          - deployment: UpgradeDevKafka
            displayName: Review, approve, then upgrade DEV Kafka to Standard
            environment: confluent-dev
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                    - bash: |
                        set -euo pipefail
                        VERSION="$(terraformVersion)"
                        curl --fail --silent --show-error --location --retry 3 -o terraform.zip \
                          "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
                        unzip -q terraform.zip terraform
                        sudo install terraform /usr/local/bin/terraform
                        rm -f terraform.zip terraform
                        terraform -chdir=environments/dev fmt -check
                        terraform -chdir=environments/dev init -backend=false -input=false -lockfile=readonly
                        terraform -chdir=environments/dev validate -no-color
                      displayName: Install and validate Terraform
                    - task: AzureKeyVault@2
                      displayName: Retrieve Confluent Cloud credentials
                      inputs:
                        azureSubscription: $(azureServiceConnection)
                        KeyVaultName: $(keyVaultName)
                        SecretsFilter: confluent-cloud-api-key,confluent-cloud-api-secret
                        RunAsPreJob: false
                    - task: AzureCLI@2
                      displayName: Verify exact in-place upgrade plan and apply it
                      inputs:
                        azureSubscription: $(azureServiceConnection)
                        scriptType: bash
                        scriptLocation: inlineScript
                        addSpnToEnvironment: true
                        workingDirectory: $(Build.SourcesDirectory)
                        inlineScript: |
                          set -euo pipefail
                          umask 077
                          PLAN_DIR="$(mktemp -d "$(Agent.TempDirectory)/dev-upgrade.XXXXXXXX")"
                          trap 'rm -rf -- "$PLAN_DIR"' EXIT
                          export ARM_USE_OIDC=true ARM_USE_AZUREAD=true ARM_USE_CLI=false
                          export ARM_CLIENT_ID="$servicePrincipalId"
                          export ARM_TENANT_ID="$tenantId"
                          export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                          export ARM_OIDC_TOKEN="$idToken"
                          export TF_VAR_confluent_cloud_api_key="$CONFLUENT_CLOUD_API_KEY"
                          export TF_VAR_confluent_cloud_api_secret="$CONFLUENT_CLOUD_API_SECRET"
                          terraform -chdir=environments/dev init -input=false -lockfile=readonly \
                            -backend-config=use_cli=false -backend-config=use_oidc=true \
                            -backend-config=use_azuread_auth=true
                          terraform -chdir=environments/dev plan -input=false -no-color -lock-timeout=5m \
                            -var=deploy_kafka_cluster=true \
                            -var=deploy_service_accounts=true \
                            -var=deploy_rbac=true \
                            -var=deploy_kafka_api_keys=true \
                            -out="$PLAN_DIR/tfplan"
                          terraform -chdir=environments/dev show -json "$PLAN_DIR/tfplan" > "$PLAN_DIR/plan.json"
                          export PLAN_JSON="$PLAN_DIR/plan.json"
                          python3 - <<'PYCODE'
                          import json, os, sys
                          with open(os.environ['PLAN_JSON'], encoding='utf-8') as f:
                              plan = json.load(f)
                          expected = 'module.kafka_cluster[0].confluent_kafka_cluster.this'
                          changes = [
                              (r.get('address'), r.get('type'), r.get('change', {}).get('actions', []))
                              for r in plan.get('resource_changes', [])
                              if r.get('change', {}).get('actions', []) not in (['no-op'], ['read'])
                          ]
                          for address, resource_type, actions in changes:
                              print(f'Resource change: {address}: {actions}')
                          if changes != [(expected, 'confluent_kafka_cluster', ['update'])]:
                              print('##vso[task.logissue type=error]Plan is not exactly one in-place cluster update; Apply blocked.')
                              sys.exit(1)
                          change = next(r.get('change', {}) for r in plan.get('resource_changes', [])
                                        if r.get('address') == expected)
                          before = change.get('before', {})
                          after = change.get('after', {})
                          env = after.get('environment') or []
                          same = all(before.get(k) == after.get(k)
                                     for k in ('id', 'display_name', 'cloud', 'region', 'availability'))
                          valid = (same
                                   and after.get('id') == 'lkc-xxxxxx'
                                   and after.get('display_name') == 'kafka-dev'
                                   and after.get('cloud') == 'AZURE'
                                   and after.get('region') == 'eastus'
                                   and after.get('availability') == 'SINGLE_ZONE'
                                   and bool(before.get('basic'))
                                   and bool(after.get('standard'))
                                   and not after.get('basic')
                                   and not after.get('enterprise')
                                   and isinstance(env, list) and len(env) == 1
                                   and env[0].get('id') == 'env-xxxxxx')
                          if not valid:
                              print('##vso[task.logissue type=error]Cluster identity or type mismatch; Apply blocked.')
                              sys.exit(1)
                          print('PASS: in-place Basic to Standard upgrade of existing lkc-xxxxxx only.')
                          PYCODE
                          terraform -chdir=environments/dev apply -input=false -auto-approve "$PLAN_DIR/tfplan"
                          echo 'DEV cluster upgraded to Standard; verify audit logs and billing.'
                      env:
                        CONFLUENT_CLOUD_API_KEY: $(confluent-cloud-api-key)
                        CONFLUENT_CLOUD_API_SECRET: $(confluent-cloud-api-secret)
