# DEV Schema Registry API key managed by Terraform.
# Stage 1 is a plan-only preview (no approval, nothing applied).
# Stage 2 runs only when enableApply is true, waits for the confluent-dev approval, creates the key
# and writes it to Key Vault as dev-schema-registry-api-key / dev-schema-registry-api-secret.
# It never touches the Kafka cluster, topics, schemas or the existing keys.
name: confluent-platform-dev-schema-registry-key-$(Date:yyyyMMdd)$(Rev:.r)
trigger: none
pr: none

parameters:
  - name: enableApply
    displayName: 'Create the Terraform-managed Schema Registry key and update Key Vault'
    type: boolean
    default: false

pool:
  vmImage: ubuntu-24.04

variables:
  terraformVersion: '1.17.1'
  azureServiceConnection: azure-confluent-service-connection
  keyVaultName: kv-confluent-example

stages:
  - stage: Preview
    displayName: Plan-only Schema Registry key preview
    jobs:
      - job: PlanOnly
        steps:
          - checkout: self
          - bash: |
              set -euo pipefail
              VERSION="$(terraformVersion)"
              curl --fail --silent --show-error --location --retry 3 -o terraform.zip \
                "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
              unzip -q terraform.zip terraform
              sudo install terraform /usr/local/bin/terraform
              rm -f terraform.zip terraform
              terraform -chdir=environments/dev fmt -check
              terraform -chdir=environments/dev init -backend=false -input=false -lockfile=readonly
              terraform -chdir=environments/dev validate -no-color
            displayName: Install and validate Terraform
          - task: AzureKeyVault@2
            displayName: Retrieve Confluent Cloud credentials
            inputs:
              azureSubscription: $(azureServiceConnection)
              KeyVaultName: $(keyVaultName)
              SecretsFilter: confluent-cloud-api-key,confluent-cloud-api-secret
              RunAsPreJob: false
          - task: AzureCLI@2
            displayName: Plan and verify exactly one new Schema Registry key (no Apply)
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: $(Build.SourcesDirectory)
              inlineScript: |
                set -euo pipefail
                umask 077
                PLAN_DIR="$(mktemp -d "$(Agent.TempDirectory)/dev-sr-key.XXXXXXXX")"
                trap 'rm -rf -- "$PLAN_DIR"' EXIT
                export PLAN_DIR
                export ARM_USE_OIDC=true ARM_USE_AZUREAD=true ARM_USE_CLI=false
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                export ARM_OIDC_TOKEN="$idToken"
                export TF_VAR_confluent_cloud_api_key="$CONFLUENT_CLOUD_API_KEY"
                export TF_VAR_confluent_cloud_api_secret="$CONFLUENT_CLOUD_API_SECRET"
                terraform -chdir=environments/dev init -input=false -lockfile=readonly \
                  -backend-config=use_cli=false -backend-config=use_oidc=true \
                  -backend-config=use_azuread_auth=true
                terraform -chdir=environments/dev plan -input=false -no-color -lock-timeout=5m \
                  -var=deploy_kafka_cluster=true \
                  -var=deploy_service_accounts=true \
                  -var=deploy_rbac=true \
                  -var=deploy_kafka_api_keys=true \
                  -var=deploy_schema_registry_api_key=true \
                  -out="$PLAN_DIR/tfplan"
                terraform -chdir=environments/dev show -json "$PLAN_DIR/tfplan" > "$PLAN_DIR/plan.json"
                export PLAN_JSON="$PLAN_DIR/plan.json"
                python3 - <<'PYCODE'
                import json, os, sys
                with open(os.environ['PLAN_JSON'], encoding='utf-8') as f:
                    plan = json.load(f)
                expected = 'confluent_api_key.schema_registry[0]'
                changes = [
                    (r.get('address'), r.get('type'), r.get('change', {}).get('actions', []))
                    for r in plan.get('resource_changes', [])
                    if r.get('change', {}).get('actions', []) not in (['no-op'], ['read'])
                ]
                for address, resource_type, actions in changes:
                    print(f'Resource change: {address}: {actions}')
                if changes != [(expected, 'confluent_api_key', ['create'])]:
                    print('##vso[task.logissue type=error]Plan is not exactly one new Schema Registry key; Apply blocked.')
                    sys.exit(1)
                after = next(r.get('change', {}).get('after', {})
                             for r in plan.get('resource_changes', []) if r.get('address') == expected)
                owner = after.get('owner') or []
                managed = after.get('managed_resource') or []
                valid = (after.get('display_name') == 'dev-schema-registry-terraform-key'
                         and isinstance(owner, list) and len(owner) == 1 and owner[0].get('id') == 'sa-xxxxxxx'
                         and isinstance(managed, list) and len(managed) == 1 and managed[0].get('id') == 'lsrc-xxxxxx')
                if not valid:
                    print('##vso[task.logissue type=error]Key owner or Schema Registry target mismatch; Apply blocked.')
                    sys.exit(1)
                print('PASS: exactly one new key for sa-dev-platform on Schema Registry lsrc-xxxxxx.')
                PYCODE
                echo 'Preview only: nothing was applied.'
            env:
              CONFLUENT_CLOUD_API_KEY: $(confluent-cloud-api-key)
              CONFLUENT_CLOUD_API_SECRET: $(confluent-cloud-api-secret)

  - ${{ if eq(parameters.enableApply, true) }}:
      - stage: ApprovedSchemaRegistryKey
        displayName: Manually approved Schema Registry key creation
        dependsOn: Preview
        jobs:
          - deployment: ApplySrKey
            displayName: Review, approve, then create the key
            environment: confluent-dev
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                    - bash: |
                        set -euo pipefail
                        VERSION="$(terraformVersion)"
                        curl --fail --silent --show-error --location --retry 3 -o terraform.zip \
                          "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
                        unzip -q terraform.zip terraform
                        sudo install terraform /usr/local/bin/terraform
                        rm -f terraform.zip terraform
                        terraform -chdir=environments/dev fmt -check
                        terraform -chdir=environments/dev init -backend=false -input=false -lockfile=readonly
                        terraform -chdir=environments/dev validate -no-color
                      displayName: Install and validate Terraform
                    - task: AzureKeyVault@2
                      displayName: Retrieve Confluent Cloud credentials
                      inputs:
                        azureSubscription: $(azureServiceConnection)
                        KeyVaultName: $(keyVaultName)
                        SecretsFilter: confluent-cloud-api-key,confluent-cloud-api-secret
                        RunAsPreJob: false
                    - task: AzureCLI@2
                      displayName: Verify exact plan, apply it and sync to Key Vault
                      inputs:
                        azureSubscription: $(azureServiceConnection)
                        scriptType: bash
                        scriptLocation: inlineScript
                        addSpnToEnvironment: true
                        workingDirectory: $(Build.SourcesDirectory)
                        inlineScript: |
                          set -euo pipefail
                          umask 077
                          PLAN_DIR="$(mktemp -d "$(Agent.TempDirectory)/dev-sr-key.XXXXXXXX")"
                          trap 'rm -rf -- "$PLAN_DIR"' EXIT
                          export PLAN_DIR
                          export ARM_USE_OIDC=true ARM_USE_AZUREAD=true ARM_USE_CLI=false
                          export ARM_CLIENT_ID="$servicePrincipalId"
                          export ARM_TENANT_ID="$tenantId"
                          export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                          export ARM_OIDC_TOKEN="$idToken"
                          export TF_VAR_confluent_cloud_api_key="$CONFLUENT_CLOUD_API_KEY"
                          export TF_VAR_confluent_cloud_api_secret="$CONFLUENT_CLOUD_API_SECRET"
                          terraform -chdir=environments/dev init -input=false -lockfile=readonly \
                            -backend-config=use_cli=false -backend-config=use_oidc=true \
                            -backend-config=use_azuread_auth=true
                          terraform -chdir=environments/dev plan -input=false -no-color -lock-timeout=5m \
                            -var=deploy_kafka_cluster=true \
                            -var=deploy_service_accounts=true \
                            -var=deploy_rbac=true \
                            -var=deploy_kafka_api_keys=true \
                            -var=deploy_schema_registry_api_key=true \
                            -out="$PLAN_DIR/tfplan"
                          terraform -chdir=environments/dev show -json "$PLAN_DIR/tfplan" > "$PLAN_DIR/plan.json"
                          export PLAN_JSON="$PLAN_DIR/plan.json"
                          python3 - <<'PYCODE'
                          import json, os, sys
                          with open(os.environ['PLAN_JSON'], encoding='utf-8') as f:
                              plan = json.load(f)
                          expected = 'confluent_api_key.schema_registry[0]'
                          changes = [
                              (r.get('address'), r.get('type'), r.get('change', {}).get('actions', []))
                              for r in plan.get('resource_changes', [])
                              if r.get('change', {}).get('actions', []) not in (['no-op'], ['read'])
                          ]
                          for address, resource_type, actions in changes:
                              print(f'Resource change: {address}: {actions}')
                          if changes != [(expected, 'confluent_api_key', ['create'])]:
                              print('##vso[task.logissue type=error]Plan is not exactly one new Schema Registry key; Apply blocked.')
                              sys.exit(1)
                          after = next(r.get('change', {}).get('after', {})
                                       for r in plan.get('resource_changes', []) if r.get('address') == expected)
                          owner = after.get('owner') or []
                          managed = after.get('managed_resource') or []
                          valid = (after.get('display_name') == 'dev-schema-registry-terraform-key'
                                   and isinstance(owner, list) and len(owner) == 1 and owner[0].get('id') == 'sa-xxxxxxx'
                                   and isinstance(managed, list) and len(managed) == 1 and managed[0].get('id') == 'lsrc-xxxxxx')
                          if not valid:
                              print('##vso[task.logissue type=error]Key owner or Schema Registry target mismatch; Apply blocked.')
                              sys.exit(1)
                          print('PASS: exactly one new key for sa-dev-platform on Schema Registry lsrc-xxxxxx.')
                          PYCODE
                          terraform -chdir=environments/dev apply -input=false -no-color "$PLAN_DIR/tfplan"
                          export KEY_VAULT_NAME="$(keyVaultName)"
                          python3 - <<'PYCODE'
                          import json, os, pathlib, subprocess
                          directory = pathlib.Path(os.environ['PLAN_DIR'])
                          result = subprocess.run(
                              ['terraform', '-chdir=environments/dev', 'output', '-json', 'dev_schema_registry_api_key_credentials'],
                              check=True, capture_output=True, text=True)
                          credentials = json.loads(result.stdout)
                          for field in ('key', 'secret'):
                              value = (credentials or {}).get(field)
                              if not isinstance(value, str) or not value:
                                  raise RuntimeError('Missing credential field; Key Vault sync stopped')
                              path = directory / f'sr-{field}.txt'
                              path.write_text(value, encoding='utf-8')
                              path.chmod(0o600)
                              subprocess.run([
                                  'az', 'keyvault', 'secret', 'set',
                                  '--vault-name', os.environ['KEY_VAULT_NAME'],
                                  '--name', f'dev-schema-registry-api-{field}',
                                  '--file', str(path), '--encoding', 'utf-8', '--output', 'none',
                              ], check=True)
                              path.unlink()
                          print('PASS: Schema Registry key and secret synchronized to Azure Key Vault (values hidden).')
                          PYCODE
                      env:
                        CONFLUENT_CLOUD_API_KEY: $(confluent-cloud-api-key)
                        CONFLUENT_CLOUD_API_SECRET: $(confluent-cloud-api-secret)
