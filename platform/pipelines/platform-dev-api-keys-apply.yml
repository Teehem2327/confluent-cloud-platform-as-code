# Manual DEV Kafka API-key deployment. Requires Azure DevOps environment approval.
# Existing Kafka cluster, service accounts, and RBAC must remain unchanged.
name: confluent-dev-api-keys-apply-$(Date:yyyyMMdd)$(Rev:.r)
trigger: none
pr: none

parameters:
  - name: enableApply
    displayName: Explicitly authorize DEV API-key Apply
    type: boolean
    default: false

pool:
  vmImage: ubuntu-24.04

variables:
  azureServiceConnection: azure-confluent-service-connection
  keyVaultName: kv-confluent-example
  terraformVersion: '1.17.1'

stages:
  - stage: Notice
    displayName: Deployment disabled by default
    jobs:
      - job: Notice
        steps:
          - bash: |
              echo 'No deployment unless enableApply=true and confluent-dev approval passes.'
            displayName: Deployment notice

  - ${{ if eq(parameters.enableApply, true) }}:
      - stage: DeployDevKeys
        displayName: Approved DEV Kafka API keys and Key Vault sync
        dependsOn: Notice
        jobs:
          - deployment: Deploy
            displayName: Review and deploy exactly two DEV Kafka API keys
            environment: confluent-dev
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                    - bash: |
                        set -euo pipefail
                        VERSION="$(terraformVersion)"
                        curl --fail --silent --show-error --location --retry 3 -o terraform.zip \
                          "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
                        unzip -q terraform.zip terraform
                        sudo install terraform /usr/local/bin/terraform
                        rm -f terraform.zip terraform
                        terraform fmt -check -recursive
                        terraform -chdir=environments/dev init -backend=false -input=false -lockfile=readonly
                        terraform -chdir=environments/dev validate -no-color
                      displayName: Install Terraform and validate
                    - task: AzureKeyVault@2
                      displayName: Retrieve Confluent Cloud credentials
                      inputs:
                        azureSubscription: $(azureServiceConnection)
                        KeyVaultName: $(keyVaultName)
                        SecretsFilter: confluent-cloud-api-key,confluent-cloud-api-secret
                        RunAsPreJob: false
                    - task: AzureCLI@2
                      displayName: Verify two API keys, Apply saved plan, sync to Key Vault
                      inputs:
                        azureSubscription: $(azureServiceConnection)
                        scriptType: bash
                        scriptLocation: inlineScript
                        addSpnToEnvironment: true
                        workingDirectory: $(Build.SourcesDirectory)
                        inlineScript: |
                          set -euo pipefail
                          umask 077
                          PLAN_DIR="$(mktemp -d "$(Agent.TempDirectory)/dev-api-keys.XXXXXXXX")"
                          trap 'rm -rf -- "$PLAN_DIR"' EXIT
                          export PLAN_DIR
                          export ARM_USE_OIDC=true ARM_USE_AZUREAD=true ARM_USE_CLI=false
                          export ARM_CLIENT_ID="$servicePrincipalId"
                          export ARM_TENANT_ID="$tenantId"
                          export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                          export ARM_OIDC_TOKEN="$idToken"
                          export TF_VAR_confluent_cloud_api_key="$CONFLUENT_CLOUD_API_KEY"
                          export TF_VAR_confluent_cloud_api_secret="$CONFLUENT_CLOUD_API_SECRET"
                          terraform -chdir=environments/dev init -input=false -lockfile=readonly \
                            -backend-config=use_cli=false -backend-config=use_oidc=true \
                            -backend-config=use_azuread_auth=true
                          terraform -chdir=environments/dev plan -input=false -no-color \
                            -var=deploy_kafka_cluster=true \
                            -var=deploy_service_accounts=true \
                            -var=deploy_rbac=true \
                            -var=deploy_kafka_api_keys=true \
                            -out="$PLAN_DIR/tfplan"
                          terraform -chdir=environments/dev show -json "$PLAN_DIR/tfplan" > "$PLAN_DIR/plan.json"
                          python3 - <<'PYCODE'
                          import json, os, sys
                          with open(os.path.join(os.environ['PLAN_DIR'], 'plan.json'), encoding='utf-8') as f:
                              plan = json.load(f)
                          expected = {
                              'module.api_keys.confluent_api_key.this["platform"]',
                              'module.api_keys.confluent_api_key.this["application"]',
                          }
                          changes = {}
                          for resource in plan.get('resource_changes', []):
                              actions = resource.get('change', {}).get('actions', [])
                              if actions not in (['no-op'], ['read']):
                                  changes[resource['address']] = actions
                          for address, actions in changes.items():
                              print(f'Resource change: {address}: {actions}')
                          if set(changes) != expected or any(a != ['create'] for a in changes.values()):
                              print('##vso[task.logissue type=error]Blocked: only two DEV API-key creations are permitted.')
                              sys.exit(1)
                          print('PASS: exactly two DEV API-key creations; no other resource changes.')
                          PYCODE
                          echo 'Applying the exact gated plan.'
                          terraform -chdir=environments/dev apply -input=false -no-color "$PLAN_DIR/tfplan"
                          # Read sensitive outputs in memory; write short-lived files only for az CLI --file.
                          # Do not echo, trace, publish, or upload Terraform state/plan/secret files.
                          export KEY_VAULT_NAME="$(keyVaultName)"
                          python3 - <<'PYCODE'
                          import json, os, pathlib, subprocess
                          directory = pathlib.Path(os.environ['PLAN_DIR'])
                          result = subprocess.run(
                              ['terraform', '-chdir=environments/dev', 'output', '-json', 'dev_kafka_api_key_credentials'],
                              check=True, capture_output=True, text=True)
                          credentials = json.loads(result.stdout)
                          expected = {'platform', 'application'}
                          if set(credentials) != expected:
                              raise RuntimeError('Unexpected API key output entries; Key Vault sync stopped')
                          for role, prefix in [('platform', 'dev-platform-kafka'), ('application', 'dev-application-kafka')]:
                              for field in ('key', 'secret'):
                                  value = credentials[role][field]
                                  if not isinstance(value, str) or not value:
                                      raise RuntimeError('Missing credential field; Key Vault sync stopped')
                                  path = directory / f'{role}-{field}.txt'
                                  path.write_text(value, encoding='utf-8')
                                  path.chmod(0o600)
                                  subprocess.run([
                                      'az', 'keyvault', 'secret', 'set',
                                      '--vault-name', os.environ['KEY_VAULT_NAME'],
                                      '--name', f'{prefix}-api-{field}',
                                      '--file', str(path), '--encoding', 'utf-8', '--output', 'none',
                                  ], check=True)
                                  path.unlink()
                          print('PASS: four DEV Kafka credential values synchronized to Azure Key Vault (values hidden).')
                          PYCODE
                      env:
                        CONFLUENT_CLOUD_API_KEY: $(confluent-cloud-api-key)
                        CONFLUENT_CLOUD_API_SECRET: $(confluent-cloud-api-secret)
