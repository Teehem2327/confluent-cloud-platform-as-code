# DEV read-only monitoring identity (service account, MetricsViewer binding, Cloud key).
# Stage 1 is a plan-only preview (no approval, nothing applied).
# Stage 2 runs only when enableApply is true, waits for the confluent-dev approval, creates the three
# resources and writes the key to Key Vault as dev-monitoring-confluent-api-key / -secret, which the
# Dynatrace collector reads. It never touches the Kafka cluster, topics, schemas or other keys.
name: confluent-platform-dev-monitoring-identity-$(Date:yyyyMMdd)$(Rev:.r)
trigger: none
pr: none

parameters:
  - name: enableApply
    displayName: 'Create the read-only monitoring identity and update the collector key in Key Vault'
    type: boolean
    default: false

pool:
  vmImage: ubuntu-24.04

variables:
  terraformVersion: '1.17.1'
  azureServiceConnection: azure-confluent-service-connection
  keyVaultName: kv-confluent-example

stages:
  - stage: Preview
    displayName: Plan-only monitoring identity preview
    jobs:
      - job: PlanOnly
        steps:
          - checkout: self
          - bash: |
              set -euo pipefail
              VERSION="$(terraformVersion)"
              curl --fail --silent --show-error --location --retry 3 -o terraform.zip \
                "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
              unzip -q terraform.zip terraform
              sudo install terraform /usr/local/bin/terraform
              rm -f terraform.zip terraform
              terraform -chdir=environments/dev fmt -check
              terraform -chdir=environments/dev init -backend=false -input=false -lockfile=readonly
              terraform -chdir=environments/dev validate -no-color
            displayName: Install and validate Terraform
          - task: AzureKeyVault@2
            displayName: Retrieve Confluent Cloud credentials
            inputs:
              azureSubscription: $(azureServiceConnection)
              KeyVaultName: $(keyVaultName)
              SecretsFilter: confluent-cloud-api-key,confluent-cloud-api-secret
              RunAsPreJob: false
          - task: AzureCLI@2
            displayName: Plan and verify exactly the three monitoring resources (no Apply)
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: $(Build.SourcesDirectory)
              inlineScript: |
                set -euo pipefail
                umask 077
                PLAN_DIR="$(mktemp -d "$(Agent.TempDirectory)/dev-monitoring.XXXXXXXX")"
                trap 'rm -rf -- "$PLAN_DIR"' EXIT
                export PLAN_DIR
                export ARM_USE_OIDC=true ARM_USE_AZUREAD=true ARM_USE_CLI=false
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                export ARM_OIDC_TOKEN="$idToken"
                export TF_VAR_confluent_cloud_api_key="$CONFLUENT_CLOUD_API_KEY"
                export TF_VAR_confluent_cloud_api_secret="$CONFLUENT_CLOUD_API_SECRET"
                terraform -chdir=environments/dev init -input=false -lockfile=readonly \
                  -backend-config=use_cli=false -backend-config=use_oidc=true \
                  -backend-config=use_azuread_auth=true
                terraform -chdir=environments/dev plan -input=false -no-color -lock-timeout=5m \
                  -var=deploy_kafka_cluster=true \
                  -var=deploy_service_accounts=true \
                  -var=deploy_rbac=true \
                  -var=deploy_kafka_api_keys=true \
                  -var=deploy_schema_registry_api_key=true \
                  -var=deploy_monitoring_identity=true \
                  -out="$PLAN_DIR/tfplan"
                terraform -chdir=environments/dev show -json "$PLAN_DIR/tfplan" > "$PLAN_DIR/plan.json"
                export PLAN_JSON="$PLAN_DIR/plan.json"
                python3 - <<'PYCODE'
                import json, os, sys
                with open(os.environ['PLAN_JSON'], encoding='utf-8') as f:
                    plan = json.load(f)
                expected = {
                    'confluent_service_account.monitoring[0]': 'confluent_service_account',
                    'confluent_role_binding.monitoring_metrics_viewer[0]': 'confluent_role_binding',
                    'confluent_api_key.monitoring[0]': 'confluent_api_key',
                }
                changes = {}
                for r in plan.get('resource_changes', []):
                    actions = r.get('change', {}).get('actions', [])
                    if actions not in (['no-op'], ['read']):
                        changes[r['address']] = (r.get('type'), actions, r.get('change', {}).get('after') or {})
                for address, (resource_type, actions, _) in sorted(changes.items()):
                    print(f'Resource change: {address}: {actions}')
                if set(changes) != set(expected) or any(v[1] != ['create'] or v[0] != expected[a] for a, v in changes.items()):
                    print('##vso[task.logissue type=error]Plan is not exactly the three new monitoring resources; Apply blocked.')
                    sys.exit(1)
                sa = changes['confluent_service_account.monitoring[0]'][2]
                rb = changes['confluent_role_binding.monitoring_metrics_viewer[0]'][2]
                key = changes['confluent_api_key.monitoring[0]'][2]
                crn = rb.get('crn_pattern') or ''
                valid = (sa.get('display_name') == 'sa-dev-monitoring'
                         and rb.get('role_name') == 'MetricsViewer'
                         and crn.startswith('crn://confluent.cloud/organization=')
                         and '/' not in crn[len('crn://confluent.cloud/organization='):]
                         and len(crn) > len('crn://confluent.cloud/organization=')
                         and key.get('display_name') == 'dev-monitoring-metrics-key'
                         and not key.get('managed_resource'))
                if not valid:
                    print('##vso[task.logissue type=error]Role, scope or key settings mismatch; Apply blocked.')
                    sys.exit(1)
                print('PASS: one service account, one organization-level MetricsViewer binding, one Cloud key; nothing else changes.')
                PYCODE
                echo 'Preview only: nothing was applied.'
            env:
              CONFLUENT_CLOUD_API_KEY: $(confluent-cloud-api-key)
              CONFLUENT_CLOUD_API_SECRET: $(confluent-cloud-api-secret)

  - ${{ if eq(parameters.enableApply, true) }}:
      - stage: ApprovedMonitoringIdentity
        displayName: Manually approved monitoring identity creation
        dependsOn: Preview
        jobs:
          - deployment: ApplyMonitoringIdentity
            displayName: Review, approve, then create the identity
            environment: confluent-dev
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                    - bash: |
                        set -euo pipefail
                        VERSION="$(terraformVersion)"
                        curl --fail --silent --show-error --location --retry 3 -o terraform.zip \
                          "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
                        unzip -q terraform.zip terraform
                        sudo install terraform /usr/local/bin/terraform
                        rm -f terraform.zip terraform
                        terraform -chdir=environments/dev fmt -check
                        terraform -chdir=environments/dev init -backend=false -input=false -lockfile=readonly
                        terraform -chdir=environments/dev validate -no-color
                      displayName: Install and validate Terraform
                    - task: AzureKeyVault@2
                      displayName: Retrieve Confluent Cloud credentials
                      inputs:
                        azureSubscription: $(azureServiceConnection)
                        KeyVaultName: $(keyVaultName)
                        SecretsFilter: confluent-cloud-api-key,confluent-cloud-api-secret
                        RunAsPreJob: false
                    - task: AzureCLI@2
                      displayName: Verify exact plan, apply it and sync the key to Key Vault
                      inputs:
                        azureSubscription: $(azureServiceConnection)
                        scriptType: bash
                        scriptLocation: inlineScript
                        addSpnToEnvironment: true
                        workingDirectory: $(Build.SourcesDirectory)
                        inlineScript: |
                          set -euo pipefail
                          umask 077
                          PLAN_DIR="$(mktemp -d "$(Agent.TempDirectory)/dev-monitoring.XXXXXXXX")"
                          trap 'rm -rf -- "$PLAN_DIR"' EXIT
                          export PLAN_DIR
                          export ARM_USE_OIDC=true ARM_USE_AZUREAD=true ARM_USE_CLI=false
                          export ARM_CLIENT_ID="$servicePrincipalId"
                          export ARM_TENANT_ID="$tenantId"
                          export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                          export ARM_OIDC_TOKEN="$idToken"
                          export TF_VAR_confluent_cloud_api_key="$CONFLUENT_CLOUD_API_KEY"
                          export TF_VAR_confluent_cloud_api_secret="$CONFLUENT_CLOUD_API_SECRET"
                          terraform -chdir=environments/dev init -input=false -lockfile=readonly \
                            -backend-config=use_cli=false -backend-config=use_oidc=true \
                            -backend-config=use_azuread_auth=true
                          terraform -chdir=environments/dev plan -input=false -no-color -lock-timeout=5m \
                            -var=deploy_kafka_cluster=true \
                            -var=deploy_service_accounts=true \
                            -var=deploy_rbac=true \
                            -var=deploy_kafka_api_keys=true \
                            -var=deploy_schema_registry_api_key=true \
                            -var=deploy_monitoring_identity=true \
                            -out="$PLAN_DIR/tfplan"
                          terraform -chdir=environments/dev show -json "$PLAN_DIR/tfplan" > "$PLAN_DIR/plan.json"
                          export PLAN_JSON="$PLAN_DIR/plan.json"
                          python3 - <<'PYCODE'
                          import json, os, sys
                          with open(os.environ['PLAN_JSON'], encoding='utf-8') as f:
                              plan = json.load(f)
                          expected = {
                              'confluent_service_account.monitoring[0]': 'confluent_service_account',
                              'confluent_role_binding.monitoring_metrics_viewer[0]': 'confluent_role_binding',
                              'confluent_api_key.monitoring[0]': 'confluent_api_key',
                          }
                          changes = {}
                          for r in plan.get('resource_changes', []):
                              actions = r.get('change', {}).get('actions', [])
                              if actions not in (['no-op'], ['read']):
                                  changes[r['address']] = (r.get('type'), actions, r.get('change', {}).get('after') or {})
                          for address, (resource_type, actions, _) in sorted(changes.items()):
                              print(f'Resource change: {address}: {actions}')
                          if set(changes) != set(expected) or any(v[1] != ['create'] or v[0] != expected[a] for a, v in changes.items()):
                              print('##vso[task.logissue type=error]Plan is not exactly the three new monitoring resources; Apply blocked.')
                              sys.exit(1)
                          sa = changes['confluent_service_account.monitoring[0]'][2]
                          rb = changes['confluent_role_binding.monitoring_metrics_viewer[0]'][2]
                          key = changes['confluent_api_key.monitoring[0]'][2]
                          crn = rb.get('crn_pattern') or ''
                          valid = (sa.get('display_name') == 'sa-dev-monitoring'
                                   and rb.get('role_name') == 'MetricsViewer'
                                   and crn.startswith('crn://confluent.cloud/organization=')
                                   and '/' not in crn[len('crn://confluent.cloud/organization='):]
                                   and len(crn) > len('crn://confluent.cloud/organization=')
                                   and key.get('display_name') == 'dev-monitoring-metrics-key'
                                   and not key.get('managed_resource'))
                          if not valid:
                              print('##vso[task.logissue type=error]Role, scope or key settings mismatch; Apply blocked.')
                              sys.exit(1)
                          print('PASS: one service account, one organization-level MetricsViewer binding, one Cloud key; nothing else changes.')
                          PYCODE
                          terraform -chdir=environments/dev apply -input=false -no-color "$PLAN_DIR/tfplan"
                          export KEY_VAULT_NAME="$(keyVaultName)"
                          python3 - <<'PYCODE'
                          import json, os, pathlib, subprocess
                          directory = pathlib.Path(os.environ['PLAN_DIR'])
                          result = subprocess.run(
                              ['terraform', '-chdir=environments/dev', 'output', '-json', 'dev_monitoring_api_key_credentials'],
                              check=True, capture_output=True, text=True)
                          credentials = json.loads(result.stdout)
                          for field in ('key', 'secret'):
                              value = (credentials or {}).get(field)
                              if not isinstance(value, str) or not value:
                                  raise RuntimeError('Missing credential field; Key Vault sync stopped')
                              path = directory / f'mon-{field}.txt'
                              path.write_text(value, encoding='utf-8')
                              path.chmod(0o600)
                              subprocess.run([
                                  'az', 'keyvault', 'secret', 'set',
                                  '--vault-name', os.environ['KEY_VAULT_NAME'],
                                  '--name', f'dev-monitoring-confluent-api-{field}',
                                  '--file', str(path), '--encoding', 'utf-8', '--output', 'none',
                              ], check=True)
                              path.unlink()
                          print('PASS: monitoring key and secret synchronized to Azure Key Vault (values hidden).')
                          PYCODE
                      env:
                        CONFLUENT_CLOUD_API_KEY: $(confluent-cloud-api-key)
                        CONFLUENT_CLOUD_API_SECRET: $(confluent-cloud-api-secret)
